name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx ng build --base-href /casa-da-quimica/

      # Todas as rotas são client-side: o build gera index.csr.html.
      # O 404.html faz o F5 em /cesta, /busca etc. abrir o app em vez do erro do Pages.
      - name: Preparar arquivos estáticos
        run: |
          cd dist/casa-da-quimica/browser
          cp index.csr.html index.html
          cp index.csr.html 404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/casa-da-quimica/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
