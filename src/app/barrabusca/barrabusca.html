<!-- Formulário HTML simples: envia para busca?q=termo -->
<form action="busca">
  <div class="input-group">
    <input
      type="search"
      class="form-control"
      name="q"
      placeholder="Buscar béquer, jaleco, trailer..."
      aria-label="Buscar produtos"
      required
    />
    <button class="btn btn-amarelo" type="submit"><i class="bi bi-search"></i> OK</button>
  </div>
</form>
